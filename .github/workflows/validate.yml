name: Validate theme spike

on:
  push:
    branches:
      - spike/theme-preference-test
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and refresh lockfile
        run: npm install
      - name: Commit generated lockfile when dependencies change
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh npm lockfile"
            git push
          fi
      - name: Test theme preference matrix and config
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
